name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (custom-domain layout) + static E2E
        run: |
          npm run build
          npm run e2e

      - name: Build (GitHub Pages project-site layout) + static E2E
        run: |
          NEXT_PUBLIC_BASE_PATH=/Portfolio-Website npm run build
          npm run e2e:pages
